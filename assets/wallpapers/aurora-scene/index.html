<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurora Soundfield</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #02040b; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .shade {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 46%, transparent 15%, rgba(1,3,10,.22) 60%, rgba(0,0,4,.72) 100%);
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="shade"></div>
<script>
const canvas = document.querySelector('#scene');
const ctx = canvas.getContext('2d', { alpha: false });
const config = { baseHue: 188, trails: 0.16, spectrum: true };
let width = 0, height = 0, dpr = 1;
let audio = { bands: new Float32Array(128), energy: 0, bass: 0, mid: 0, treble: 0 };
let smooth = { energy: 0, bass: 0, mid: 0, treble: 0 };

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 1.5);
  width = innerWidth;
  height = innerHeight;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

if (window.pulseRing) {
  window.pulseRing.onConfig(value => Object.assign(config, value));
  window.pulseRing.onAudio(value => { audio = value; });
}

const stars = Array.from({ length: 90 }, () => ({
  x: Math.random(), y: Math.random() * .7, size: .25 + Math.random() * 1.3,
  phase: Math.random() * Math.PI * 2, speed: .3 + Math.random() * .8,
}));

function bandValue(normalized) {
  const index = Math.max(0, Math.min(127, Math.floor(normalized * 127)));
  return audio.bands[index] || 0;
}

function drawStars(time) {
  for (const star of stars) {
    const flicker = .22 + .58 * (.5 + .5 * Math.sin(time * star.speed + star.phase));
    const flash = 1 + smooth.treble * 2.4;
    ctx.fillStyle = `rgba(186,225,255,${flicker * (.35 + smooth.treble * .42)})`;
    ctx.beginPath();
    ctx.arc(star.x * width, star.y * height, star.size * flash, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawAurora(time, layer) {
  const points = 72;
  const center = height * (.3 + layer * .085);
  const amplitude = height * (.055 + smooth.mid * .075 + layer * .012);
  const hue = Number(config.baseHue) + layer * 42 + smooth.treble * 28;
  const top = [];
  const bottom = [];
  for (let i = 0; i <= points; i++) {
    const n = i / points;
    const band = bandValue(n);
    const wave = Math.sin(n * 7.5 + time * (.42 + layer * .08) + layer * 1.7);
    const ripple = Math.sin(n * 19 - time * .28 + layer) * .28;
    const y = center + (wave + ripple) * amplitude + band * height * .09;
    const thickness = height * (.08 + band * .16 + smooth.energy * .05);
    top.push([n * width, y - thickness]);
    bottom.push([n * width, y + thickness * .5]);
  }
  const gradient = ctx.createLinearGradient(0, center - amplitude * 2, 0, center + amplitude * 2.8);
  gradient.addColorStop(0, `hsla(${hue},95%,72%,0)`);
  gradient.addColorStop(.42, `hsla(${hue},92%,62%,${.12 + smooth.energy * .18})`);
  gradient.addColorStop(1, `hsla(${hue + 28},90%,48%,0)`);
  ctx.beginPath();
  ctx.moveTo(top[0][0], top[0][1]);
  for (const point of top) ctx.lineTo(point[0], point[1]);
  for (let i = bottom.length - 1; i >= 0; i--) ctx.lineTo(bottom[i][0], bottom[i][1]);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.shadowColor = `hsla(${hue},95%,58%,${.3 + smooth.energy * .4})`;
  ctx.shadowBlur = 22 + smooth.energy * 35;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawHorizon(time) {
  const horizon = height * .73;
  const glow = ctx.createLinearGradient(0, horizon - 2, 0, height);
  glow.addColorStop(0, `hsla(${config.baseHue + 35},90%,65%,${.2 + smooth.bass * .35})`);
  glow.addColorStop(1, 'rgba(3,8,20,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, horizon, width, height - horizon);
  ctx.strokeStyle = `hsla(${config.baseHue + 30},88%,64%,${.08 + smooth.bass * .18})`;
  ctx.lineWidth = 1;
  for (let row = 0; row < 10; row++) {
    const p = ((row / 10 + time * .035) % 1);
    const y = horizon + p * p * (height - horizon);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
  }
  for (let col = -12; col <= 12; col++) {
    ctx.beginPath();
    ctx.moveTo(width / 2 + col * 8, horizon);
    ctx.lineTo(width / 2 + col * width * .12, height);
    ctx.stroke();
  }
}

function drawCore(time) {
  const x = width / 2;
  const y = height * .66;
  const radius = Math.min(width, height) * (.026 + smooth.bass * .032);
  const halo = ctx.createRadialGradient(x, y, 0, x, y, radius * 5.5);
  halo.addColorStop(0, `hsla(${config.baseHue + 55},100%,88%,${.85 + smooth.energy * .15})`);
  halo.addColorStop(.13, `hsla(${config.baseHue + 25},95%,65%,${.72 + smooth.bass * .2})`);
  halo.addColorStop(1, `hsla(${config.baseHue},90%,50%,0)`);
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(x, y, radius * 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = `hsla(${config.baseHue + time * 8},100%,76%,${.25 + smooth.treble * .6})`;
  ctx.lineWidth = 1.2 + smooth.treble * 2;
  for (let ring = 1; ring <= 3; ring++) {
    ctx.beginPath();
    ctx.arc(x, y, radius * (1.6 + ring * 1.25) + Math.sin(time * 2 + ring) * 3, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function frame(milliseconds) {
  const time = milliseconds / 1000;
  smooth.energy += (audio.energy - smooth.energy) * .12;
  smooth.bass += (audio.bass - smooth.bass) * .2;
  smooth.mid += (audio.mid - smooth.mid) * .14;
  smooth.treble += (audio.treble - smooth.treble) * .26;
  ctx.fillStyle = `rgba(2,4,11,${Math.max(.08, Math.min(.42, Number(config.trails) || .16))})`;
  ctx.fillRect(0, 0, width, height);
  drawStars(time);
  for (let layer = 2; layer >= 0; layer--) drawAurora(time, layer);
  drawHorizon(time);
  drawCore(time);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
