<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; background: #060512; }
  canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 场景壁纸（轻量版）：保证 30fps 流畅不卡死
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);

const cfg = { particles: 36, baseHue: 262 };
let energy = 0, bass = 0, mid = 0, treble = 0, bands = null;
if (window.pulseRing) {
  window.pulseRing.onConfig((c) => Object.assign(cfg, c));
  window.pulseRing.onBands((d) => { bands = d.bands; energy = d.energy; bass = d.bass; mid = d.mid; treble = d.treble; });
}

// 粒子：轻量环绕
const P = [];
for (let i = 0; i < cfg.particles; i++) {
  P.push({
    a: Math.random() * Math.PI * 2,
    r: 0.06 + Math.random() * 0.4,
    w: (0.06 + Math.random() * 0.12) * (Math.random() < 0.5 ? 1 : -1),
    b: Math.random() * Math.PI * 2,
    s: (1.5 + Math.random() * 2) ,
    hue: (cfg.baseHue + Math.random() * 60) % 360,
  });
}

let t = 0;
function frame() {
  t += 0.016;
  ctx.fillStyle = 'rgba(6, 5, 18, 0.32)'; // 拖影（可见运动）
  ctx.fillRect(0, 0, W, H);

  // 中心光晕（呼吸 + 能量）
  const breathe = 0.7 + 0.3 * Math.sin(t * 2.0);
  const r = (140 + 60 * breathe + energy * 260);
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, r);
  g.addColorStop(0, `hsla(${cfg.baseHue}, 80%, ${55 + energy * 20}%, ${0.18 * breathe + energy * 0.3})`);
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 粒子：环绕 + 低音甩出
  for (const p of P) {
    p.a += p.w + energy * 0.03;
    p.b += 0.02 + energy * 0.05;
    let rr = p.r + Math.sin(p.b) * 0.08;
    if (bass > 0.1 && Math.random() < bass * 0.2) rr += bass * 0.2;
    const x = W/2 + Math.cos(p.a) * rr * W;
    const y = H/2 + Math.sin(p.a) * rr * H;
    ctx.beginPath();
    ctx.arc(x, y, p.s * (1 + energy), 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 85%, ${62 + energy * 22}%, ${0.55 + energy * 0.4})`;
    ctx.fill();
  }

  // 底部频谱条（轻量）
  if (bands) {
    const bw = W / 40;
    const bh = H * 0.08;
    for (let i = 0; i < 40; i++) {
      const v = bands[Math.floor(i * 3.2)] * bh;
      if (v < 0.5) continue;
      ctx.fillStyle = `hsla(${cfg.baseHue + i * 5}, 80%, 58%, 0.4)`;
      ctx.fillRect(i * bw, H - v, bw * 0.7, v);
    }
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
