<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; background: radial-gradient(circle at 50% 55%, #12101f, #05040a); }
  canvas { position: absolute; inset: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 场景壁纸：音频驱动的粒子系统（pulse-ring 音频 API）
// window.pulseRing.onBands() 每帧提供 128 频段 + 能量 + bass/mid/treble
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width = innerWidth * DPR;
  H = canvas.height = innerHeight * DPR;
}
resize();
addEventListener('resize', resize);

const cfg = { particles: 120, baseHue: 262 }; // 会被 manifest params 覆盖
window.pulseRing.onConfig((c) => Object.assign(cfg, c));

// 粒子：中心向外弹射，随音频能量脉冲
const P = [];
function spawn() {
  const ang = Math.random() * Math.PI * 2;
  return {
    x: W/2, y: H/2,
    vx: Math.cos(ang) * (0.5 + Math.random() * 1.5),
    vy: Math.sin(ang) * (0.5 + Math.random() * 1.5),
    size: (2 + Math.random() * 4) * DPR,
    hue: cfg.baseHue + Math.random() * 60,
    life: 1,
  };
}
for (let i = 0; i < cfg.particles; i++) P.push(spawn());

let energy = 0, bass = 0, mid = 0, treble = 0, bands = null;

window.pulseRing.onBands((d) => {
  bands = d.bands;
  energy = d.energy;
  bass = d.bass;
  mid = d.mid;
  treble = d.treble;
});

let t = 0;
function frame() {
  t += 0.016;
  // 能量平滑（上升快、衰减慢）
  const target = energy * (0.4 + bass * 0.6);
  const pulse = target > energy ? target : energy * 0.9;

  ctx.fillStyle = 'rgba(5, 4, 10, 0.28)'; // 半透明拖影
  ctx.fillRect(0, 0, W, H);

  // 中心光晕随能量
  const glowR = 120 * DPR + pulse * 300 * DPR;
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, glowR);
  g.addColorStop(0, `hsla(${cfg.baseHue}, 80%, 60%, ${0.25 + pulse * 0.4})`);
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 粒子：bass 时向外弹射加速，treble 时抖动
  for (const p of P) {
    p.vx *= 0.99; p.vy *= 0.99;
    p.vx += (Math.random() - 0.5) * treble * 0.8;
    p.vy += (Math.random() - 0.5) * treble * 0.8;
    if (Math.random() < bass * 0.15) { // 低音脉冲重新弹射
      const ang = Math.random() * Math.PI * 2;
      const sp = 2 + bass * 6;
      p.vx = Math.cos(ang) * sp; p.vy = Math.sin(ang) * sp;
    }
    p.x += p.vx * DPR; p.y += p.vy * DPR;
    // 回到中心
    const dx = W/2 - p.x, dy = H/2 - p.y;
    p.x += dx * 0.004; p.y += dy * 0.004;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (1 + pulse), 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 85%, ${60 + pulse * 30}%, ${0.6 + pulse * 0.4})`;
    ctx.fill();
  }

  // 底部频谱条（低频更宽）
  if (bands) {
    const bw = W / 64;
    const bh = H * 0.12;
    for (let i = 0; i < 64; i++) {
      const v = bands[Math.floor(i * 2)] * bh;
      ctx.fillStyle = `hsla(${cfg.baseHue + i}, 80%, 60%, 0.5)`;
      ctx.fillRect(i * bw, H - v, bw * 0.7, v);
    }
  }
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
